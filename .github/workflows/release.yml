name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p coffre-cli
      - name: Package
        run: |
          set -eu
          name="coffre-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/coffre "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/coffre-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/coffre-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
