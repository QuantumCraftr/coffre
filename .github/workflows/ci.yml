name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  audit:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check

  miri:
    name: miri (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri
        run: cargo +nightly miri test -p coffre-core --test crypto_vectors --test format --test properties

  sanitizers:
    name: address sanitizer (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: AddressSanitizer
        run: RUSTFLAGS="-Zsanitizer=address" cargo test -p coffre-core --tests

  fuzz:
    name: fuzz smoke (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz header_decode
        run: cargo +nightly fuzz run header_decode -- -runs=50000 -max_len=256
      - name: Fuzz payload_decode
        run: cargo +nightly fuzz run payload_decode -- -runs=50000 -max_len=1024

  independent-verifier:
    name: independent python verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install argon2-cffi pynacl
      - name: Build CLI
        run: cargo build --locked -p coffre-cli
      - name: Cross-implementation check
        run: |
          set -eu
          export COFFRE_PASSPHRASE=test-pass
          V=/tmp/verify.coffre
          ./target/debug/coffre init "$V"
          printf '%s' 's3cret' | ./target/debug/coffre add "$V" API_KEY
          python scripts/verify_vault.py "$V"
