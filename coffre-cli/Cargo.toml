[package]
name = "coffre-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Interface en ligne de commande du coffre"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/coffre-cli"
keywords = ["secrets", "vault", "cli", "security", "agents"]
