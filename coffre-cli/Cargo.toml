[package]
name = "coffre-cli"
version = "0.1.0"
edition = "2024"
description = "Interface en ligne de commande du coffre"
license = "MIT OR Apache-2.0"
repository = "https://github.com/QuantumCraftr/coffre"
homepage = "https://github.com/QuantumCraftr/coffre"
documentation = "https://docs.rs/coffre-cli"
keywords = ["secrets", "vault", "cli", "security", "agents"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "coffre"
path = "src/main.rs"

[dependencies]
coffre-core = { path = "../coffre-core", version = "0.1.0" }
rpassword = "7.5"
zeroize = "1.9"
