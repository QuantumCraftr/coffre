[package]
name = "coffre-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Coffre core: file format, encryption, zeroization"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/coffre-core"
keywords = ["secrets", "vault", "security", "encryption", "aead"]
categories = ["cryptography"]

[dependencies]
# Well-tested cryptographic primitives (RustCrypto), minimal features.
# argon2: key derivation (Argon2id). No getrandom/password-hash: we supply the salt.
# chacha20poly1305: XChaCha20-Poly1305 AEAD. No getrandom: we supply the nonce.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4", features = ["std", "sys_rng"] }
zeroize = "1.9"
